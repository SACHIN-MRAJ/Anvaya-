# ANUMATI web tier: serves the built website and forwards /api to the API on the same address,
# so the session cookie is first-party and no cross-site setup is needed.
upstream anumati_api {
  server api:8000;
  keepalive 16;
}

server {
  listen 8080;
  server_name _;
  server_tokens off;
  root /usr/share/nginx/html;
  client_max_body_size 220m;   # up to 20 visit photos of 10 MB each

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml text/plain;

  location /api/aicte/activity/stream {          # Server-Sent Events: no buffering, long reads
    proxy_pass http://anumati_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
    proxy_buffering off;
    proxy_read_timeout 1h;
  }

  location ~ ^/(api|\.well-known)/ {
    proxy_pass http://anumati_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
    proxy_read_timeout 120s;
  }

  location = /metrics { return 404; }             # metrics are scraped inside the network, not through the website

  location /assets/ {                              # file names carry a content hash, so they never change
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  location / {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri $uri/ /index.html;
  }
}
